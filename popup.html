<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>Workspace Launcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" aria-label="Workspace Launcher">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
        </span>
        <div class="brand-text">
          <span class="eyebrow">Index</span>
          <h1 class="title">Workspaces</h1>
        </div>
      </div>
      <button id="saveBtn" class="save-btn" type="button" title="Save all tabs in the current window as a workspace">
        <span class="plus" aria-hidden="true">+</span>
        <span class="save-label">Save current</span>
      </button>
    </header>

    <section class="list-wrap" aria-live="polite" aria-busy="false">
      <ul id="list" class="list" role="list"></ul>
      <div id="empty" class="empty" hidden>
        <div class="empty-art" aria-hidden="true">
          <span class="ghost-bar"></span>
          <span class="ghost-bar"></span>
          <span class="ghost-bar"></span>
        </div>
        <p class="empty-title">Your index is empty</p>
        <p class="empty-hint">Save the tabs in this window to build your first workspace.</p>
      </div>
      <div id="error" class="error" hidden role="alert"></div>
    </section>

    <footer class="footer">
      <span id="countLabel" class="count-label"></span>
    </footer>
  </main>

  <dialog id="confirmDialog" class="confirm-dialog">
    <form method="dialog" class="confirm-form">
      <p class="confirm-title">Delete this workspace?</p>
      <p class="confirm-body" id="confirmBody">This can't be undone.</p>
      <div class="confirm-actions">
        <button value="cancel" class="btn btn-ghost" type="submit">Cancel</button>
        <button value="confirm" class="btn btn-danger" type="submit">Delete</button>
      </div>
    </form>
  </dialog>

  <!-- Save modal: replaces native prompt() with a custom flow
       that lets the user exclude individual tabs before saving. -->
  <dialog id="saveModal" class="save-modal" aria-labelledby="saveTitle">
    <form class="save-form" id="saveForm">
      <header class="save-header">
        <span class="eyebrow save-eyebrow">New</span>
        <h2 class="save-title" id="saveTitle">Save workspace</h2>
      </header>

      <label class="save-field">
        <span class="save-label">Name</span>
        <input
          id="saveName"
          class="name-input"
          type="text"
          maxlength="80"
          autocomplete="off"
          spellcheck="false"
        >
      </label>

      <label class="exclude-toggle">
        <input id="excludeToggle" class="exclude-toggle-cb" type="checkbox">
        <span class="exclude-toggle-text">Exclude some tabs?</span>
      </label>

      <div id="excludeSection" class="exclude-section" hidden>
        <ul id="tabList" class="tab-list" role="list"></ul>
        <p id="saveValidation" class="validation-msg" hidden>
          At least one tab must be included.
        </p>
      </div>

      <div class="save-actions">
        <button id="cancelBtn" class="btn btn-ghost" type="button">Cancel</button>
        <button id="saveOk" class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="popup.js"></script>
</body>
</html>
